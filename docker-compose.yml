x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  migrate:
    image: nucleoisp:latest
    pull_policy: never
    container_name: nucleoisp_prod_migrate
    command: >
      sh -c "python manage.py migrate_schemas --shared &&
      python manage.py migrate_schemas --tenant &&
      python manage.py collectstatic --noinput"
    volumes:
      - static_data:/app/staticfiles
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  web:
    build: .
    image: nucleoisp:latest
    container_name: nucleoisp_prod_web
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    logging: *logging

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    container_name: nucleoisp_prod_redis
    restart: always
    logging: *logging

  db:
    image: postgres:17
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    container_name: nucleoisp_prod_db
    env_file:
      - .env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    logging: *logging

  caddy:
    image: caddy:2.11-alpine
    container_name: nucleoisp_prod_caddy
    ports:
      - "443:443"
      - "443:443/udp"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - web
    restart: always
    logging: *logging

  celery_worker:
    image: nucleoisp:latest
    pull_policy: never
    container_name: nucleoisp_prod_celery_worker
    command: celery -A conexiones worker -l info
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    logging: *logging

  celery_beat:
    image: nucleoisp:latest
    pull_policy: never
    container_name: nucleoisp_prod_celery_beat
    command: celery -A conexiones beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always
    logging: *logging

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: nucleoisp_prod_wg_easy
    env_file:
      - .env
    environment:
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - wg_easy_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    restart: always
    logging: *logging

volumes:
  static_data:
  postgres_data:
  wg_easy_data:
  media_data:
  caddy_data:
  caddy_config:
