services:
  web:
    build: .
    image: nucleoisp:dev
    container_name: nucleoisp_dev_web
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./:/app
      - /app/.venv
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_HOST: db
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    container_name: nucleoisp_dev_redis
    ports:
      - "127.0.0.1:6379:6379"

  db:
    image: postgres:17.5
    container_name: nucleoisp_dev_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - .env.dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  celery_worker:
    image: nucleoisp:dev
    pull_policy: never
    container_name: nucleoisp_dev_celery_worker
    command: uv run celery -A conexiones worker -l info
    volumes:
      - ./:/app
      - /app/.venv
    env_file:
      - .env.dev
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: nucleoisp:dev
    pull_policy: never
    container_name: nucleoisp_dev_celery_beat
    command: uv run celery -A conexiones beat -l info -s /tmp/celerybeat-schedule
    volumes:
      - ./:/app
      - /app/.venv
    env_file:
      - .env.dev
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:14
    container_name: nucleoisp_dev_wg_easy
    env_file:
      - .env.dev
    environment:
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_DEFAULT_DNS=1.1.1.1
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:51821:51821/tcp"
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - wg_easy_data_dev:/etc/wireguard
      - /lib/modules:/lib/modules:ro

volumes:
  postgres_data_dev:
  wg_easy_data_dev:
