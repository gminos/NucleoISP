<div class="flex flex-col gap-2 relative w-full{% if class %} {{ class }}{% endif %}">
    {% if titulo or detalle %}
        <div class="flex flex-row">
            <h3 class="text-font-important-light dark:text-font-important-dark text-sm">{{ titulo }}</h3>
            <strong class="bg-base-100 font-medium text-font-important-light ml-auto px-1.5 py-1 rounded-default text-xs dark:text-font-important-dark dark:bg-base-700">{{ detalle }}</strong>
        </div>
    {% endif %}
    <div class="bg-base-100 flex flex-row overflow-hidden rounded-default dark:bg-base-700">
        <div class="h-1.5 rounded-default {{ color|default:'bg-primary-600 dark:bg-primary-500' }}" style="width: {{ valor }}%"></div>
    </div>
</div>
